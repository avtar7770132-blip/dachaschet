<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор схемы посадки: сколько кустов влезет — Дача-Счёт</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="styles.css">
<style>.cf{max-width:650px;margin:0 auto}.cf label{display:block;margin-bottom:5px;font-weight:bold}.cf select,.cf input{width:100%;padding:12px;border:1px solid var(--color-border);border-radius:8px;font-size:1rem;background:#fff;margin-bottom:15px;box-sizing:border-box}.cf .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.rb{background:#fff;border:2px solid var(--color-accent);border-radius:12px;padding:25px;margin:25px auto;max-width:650px}.rb h3{color:var(--color-accent);margin-top:0}.rb ul{line-height:2;font-size:1.05rem}.ti{background:#f0fdf4;padding:10px;border-radius:6px;margin-top:15px;font-size:.9rem;color:#14532d}</style>
</head>
<body>
<div class="container">
<header style="margin-bottom:20px"><a href="index.html" style="color:var(--color-accent);font-weight:bold;text-decoration:none">← На главную</a></header>
<h1>📐 Калькулятор схемы посадки</h1>
<p class="subtitle">Сколько растений вместит грядка и какой шаг выбрать.</p>
<div class="card cf">
<div class="row">
<div><label for="spL">Длина грядки, м</label><input type="number" id="spL" value="3" min="0.5" step="0.1"></div>
<div><label for="spW">Ширина грядки, м</label><input type="number" id="spW" value="1" min="0.5" step="0.1"></div>
</div>
<label for="spCrop">Культура</label>
<select id="spCrop">
<option value="tomato">Томаты (50×70 см)</option>
<option value="pepper">Перец (40×50 см)</option>
<option value="cucumber">Огурцы (30×60 см)</option>
<option value="cabbage">Капуста (40×60 см)</option>
<option value="carrot">Морковь (5×20 см)</option>
<option value="beet">Свёкла (8×20 см)</option>
<option value="lettuce">Салат (20×20 см)</option>
<option value="onion">Лук (10×20 см)</option>
<option value="garlic">Чеснок (10×20 см)</option>
<option value="strawberry">Клубника (25×30 см)</option>
<option value="potato">Картофель (30×60 см)</option>
<option value="pumpkin">Тыква (100×140 см)</option>
<option value="zucchini">Кабачок (70×100 см)</option>
<option value="radish">Редис (5×10 см)</option>
<option value="pea">Горох (5×30 см)</option>
</select>
<label for="spMethod">Способ размещения</label>
<select id="spMethod"><option value="row">Рядовой (классика)</option><option value="chess">Шахматный (в 1,15× плотнее)</option></select>
<button onclick="calcSpace()" class="btn-link" style="width:100%;border:none;cursor:pointer;font-size:1.1rem;padding:14px">Рассчитать схему</button>
</div>
<div id="resSP"></div>
<div class="ad-banner" style="max-width:650px;margin:30px auto">[ Реклама: Рассада, колышки, шнур для рядов ]</div>
<footer style="text-align:center;margin-top:50px;color:var(--color-text-muted);font-size:.9rem">© 2027 Дача-Счёт</footer>
</div>
<script>
const SP={tomato:{r:0.5,g:0.7,n:'Томаты'},pepper:{r:0.4,g:0.5,n:'Перец'},cucumber:{r:0.3,g:0.6,n:'Огурцы'},cabbage:{r:0.4,g:0.6,n:'Капуста'},carrot:{r:0.05,g:0.2,n:'Морковь'},beet:{r:0.08,g:0.2,n:'Свёкла'},lettuce:{r:0.2,g:0.2,n:'Салат'},onion:{r:0.1,g:0.2,n:'Лук'},garlic:{r:0.1,g:0.2,n:'Чеснок'},strawberry:{r:0.25,g:0.3,n:'Клубника'},potato:{r:0.3,g:0.6,n:'Картофель'},pumpkin:{r:1.0,g:1.4,n:'Тыква'},zucchini:{r:0.7,g:1.0,n:'Кабачок'},radish:{r:0.05,g:0.1,n:'Редис'},pea:{r:0.05,g:0.3,n:'Горох'}};
function calcSpace(){
const L=parseFloat(document.getElementById('spL').value);
const W=parseFloat(document.getElementById('spW').value);
const c=SP[document.getElementById('spCrop').value];
const m=document.getElementById('spMethod').value;
if(!L||!W)return alert('Заполните размеры');
const rows=Math.floor(W/c.g);
const inRow=Math.floor(L/c.r);
if(rows<1||inRow<1){document.getElementById('resSP').innerHTML='<div class="rb fade-in"><h3>Не влезает</h3><p>Грядка '+L+'×'+W+' м слишком мала для '+c.n+' со схемой '+Math.round(c.r*100)+'×'+Math.round(c.g*100)+' см. Увеличьте ширину минимум до '+c.g+' м.</p></div>';return;}
let total=rows*inRow;
if(m==='chess')total=Math.floor(total*1.15);
const area=(L*W).toFixed(1);
const perPlant=(L*W/total).toFixed(2);
document.getElementById('resSP').innerHTML='<div class="rb fade-in"><h3>'+c.n+' · '+(m==='chess'?'шахматная':'рядовая')+' схема</h3><ul><li>📏 Шаг в ряду × между рядами: <strong>'+Math.round(c.r*100)+'×'+Math.round(c.g*100)+' см</strong></li><li>📊 Рядов: <strong>'+rows+'</strong> · в ряду: <strong>'+(m==='chess'?'~'+Math.round(inRow*1.07):inRow)+'</strong></li><li>🌿 Всего растений: <strong>'+total+' шт</strong></li><li>⬜ Площадь на растение: <strong>'+perPlant+' м²</strong></li></ul><div class="ti">💡 Не загущайте ради «больше посадить»: теснота = грибок и мелкий плод. Лучше меньше кустов, но по норме — урожай будет выше. Сверьте соседей по таблице совместимости.</div></div>';
document.getElementById('resSP').scrollIntoView({behavior:'smooth'});
}
</script>
</body>
</html>
