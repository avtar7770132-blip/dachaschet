<button onclick="makePlan()" class="btn-link" style="width:100%;border:none;cursor:pointer;font-size:1.1rem;padding:14px">Составить план</button>

<script>
const FAM={tomato:'Паслёновые',potato:'Паслёновые',pepper:'Паслёновые',eggplant:'Паслёновые',cucumber:'Тыквенные',zucchini:'Тыквенные',pumpkin:'Тыквенные',cabbage:'Капустные',radish:'Капустные',onion:'Луковые',garlic:'Луковые',carrot:'Корнеплодные и зеленные',beet:'Корнеплодные и зеленные',lettuce:'Корнеплодные и зеленные'};
const NAMES={tomato:'Томат',potato:'Картофель',pepper:'Перец',eggplant:'Баклажан',cucumber:'Огурец',zucchini:'Кабачок',pumpkin:'Тыква',cabbage:'Капуста',radish:'Редис',onion:'Лук',garlic:'Чеснок',carrot:'Морковь',beet:'Свёкла',lettuce:'Салат'};
const CYCLE=['Паслёновые','Тыквенные','Луковые','Капустные','Корнеплодные и зеленные'];
const MEMBERS={'Паслёновые':'томат, перец, баклажан','Тыквенные':'огурец, кабачок, тыква','Луковые':'лук, чеснок','Капустные':'капуста, редис','Корнеплодные и зеленные':'морковь, свёкла, салат'};
const WHY={'Паслёновые':'паслёновые забирают много азота — после них почва отдыхает под неприхотливыми тыквенными','Тыквенные':'тыквенные оставляют рыхлую почву и мало общих болезней для луковых','Луковые':'луковые обеззараживают почву фитонцидами — хорошая база для капустных','Капустные':'капустные рыхлят землю глубоко, после них хорошо идут корнеплоды','Корнеплодные и зеленные':'корнеплодные не истощают верхний слой — паслёновые получат своё питание'};
document.querySelectorAll('.bedsel').forEach(s=>{Object.keys(NAMES).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=NAMES[k];s.appendChild(o);});});
function makePlan(){
const beds=['b1','b2','b3','b4'].map(id=>document.getElementById(id).value);
const fams=beds.map(b=>FAM[b]);
let rows='';
beds.forEach((b,i)=>{
const f=fams[i];
const next=CYCLE[(CYCLE.indexOf(f)+1)%5];
rows+='<div class="plan-row"><strong>Грядка '+(i+1)+':</strong> было — '+NAMES[b]+' ('+f+') → <span style="color:var(--color-accent);font-weight:bold">сажаем '+MEMBERS[next]+'</span><br><small style="color:#666">Почему: '+WHY[f]+'.</small></div>';
});
const dup=fams.some((f,i)=>fams.indexOf(f)!==i);
const warn=dup?'<div class="warn">⚠️ Внимание: в прошлом году две грядки занимало одно семейство. В новом плане они получат одинаковую культуру — по возможности разнесите их по участку или посейте между ними сидераты.</div>':'';
document.getElementById('resP').innerHTML='<div class="rb fade-in"><h3>План на следующий сезон</h3>'+rows+warn+'<div class="ti">💡 Правило севооборота: одно семейство возвращается на грядку не раньше, чем через 3–4 года.</div></div>';
document.getElementById('resP').scrollIntoView({behavior:'smooth'});
}
</script>
