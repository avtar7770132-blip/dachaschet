<style>
.crop-selector{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:30px}
.crop-btn{padding:12px 10px;border:2px solid var(--color-border);background:#fff;border-radius:10px;cursor:pointer;font-weight:bold;font-size:.95rem;text-align:center}
.crop-btn:hover{border-color:var(--color-accent)}
.crop-btn.active{background:var(--color-accent);color:#fff;border-color:var(--color-accent)}
.result-card{background:#fff;border:1px solid var(--color-border);border-radius:12px;padding:25px;margin-bottom:30px}
.result-title{font-size:1.5rem;color:var(--color-accent);margin-bottom:20px;text-align:center}
.relations{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.relation-block{padding:15px;border-radius:10px;border:1px solid}
.relation-block h4{margin:0 0 10px;font-size:1.1rem}
.relation-block ul{margin:0;padding-left:20px;line-height:1.8}
.friends{background:#dcfce7;border-color:#22c55e}.friends h4{color:#14532d}
.enemies{background:#fee2e2;border-color:#ef4444}.enemies h4{color:#7f1d1d}
.neutral{background:#fef9c3;border-color:#eab308}.neutral h4{color:#713f12}
.tip-box{background:#f0fdf4;border-left:4px solid var(--color-accent);padding:15px;border-radius:8px;margin-top:20px}
</style>
</head>

tomato:{name:'🍅 Томат',f:['Базилик','Морковь','Лук','Чеснок','Петрушка','Бархатцы'],e:['Картофель','Фенхель','Укроп (взрослый)','Горох'],n:['Огурец','Свёкла','Салат'],t:'Базилик отпугивает тлю и улучшает вкус плодов.'},

bean:{name:'🫘 Фасоль',f:['Картофель','Огурец','Кукуруза','Свёкла','Капуста','Клубника'],e:['Лук','Чеснок','Фенхель','Горох'],n:['Морковь','Редис','Салат'],t:'Фасоль и кукуруза — классическая пара.'},

lettuce:{name:'🥗 Салат',f:['Морковь','Редис','Огурец','Клубника','Свёкла'],e:['Петрушка','Сельдерей'],n:['Томат','Капуста','Лук'],t:'Работает как живая мульча между культурами.'},
strawberry:{name:'🍓 Клубника',f:['Лук','Чеснок','Шпинат','Фасоль','Тимьян','Бархатцы'],e:['Капуста','Томат','Картофель','Малина'],n:['Морковь','Свёкла','Салат'],t:'Бархатцы отпугивают нематоду — врага ягоды №1.'}
};
function showResult(key,btn){
document.querySelectorAll('.crop-btn').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
const c=CROPS[key];
const li=a=>a.map(x=>'<li>'+x+'</li>').join('');
document.getElementById('resultArea').innerHTML='<div class="result-card fade-in"><div class="result-title">'+c.name+'</div><div class="relations"><div class="relation-block friends"><h4>✅ Друзья</h4><ul>'+li(c.f)+'</ul></div><div class="relation-block enemies"><h4>❌ Враги</h4><ul>'+li(c.e)+'</ul></div><div class="relation-block neutral"><h4>😐 Нейтральные</h4><ul>'+li(c.n)+'</ul></div></div><div class="tip-box"><strong>💡 Совет:</strong> '+c.t+'</div></div>';
}
const sel=document.getElementById('cropSelector');
Object.keys(CROPS).forEach((k,i)=>{
const b=document.createElement('button');
b.className='crop-btn';b.textContent=CROPS[k].name;
b.onclick=function(){showResult(k,b);};
sel.appendChild(b);
if(i===0)showResult(k,b);
});
</script>
