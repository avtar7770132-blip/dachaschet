<script>
function calcGreen(){
const L=parseFloat(document.getElementById('gL').value);
const W=parseFloat(document.getElementById('gW').value);
const H=parseFloat(document.getElementById('gH').value);
const type=document.getElementById('gType').value;
const cover=document.getElementById('gCover').value;
const season=document.getElementById('gSeason').value;
if(!L||!W||!H)return alert('Заполните размеры');
const S=L*W;
const V=Math.round(S*H*(type==='arch'?0.85:0.8));
let clad;
if(type==='gable'){
const hw=0.6*H;const slope=Math.sqrt((W/2)*(W/2)+(H-hw)*(H-hw));
clad=2*(L+W)*hw+2*L*slope+2*(W*hw+W*(H-hw)/2);
}else{
const wallH=Math.max(0,H-W/2);
const arc=W*(1.57+0.6*(H/W-0.5));
clad=L*arc+2*L*wallH+2*(W*wallH+0.6*W*Math.min(H,W/2));
}
clad=Math.round(clad);
let mat;
if(cover==='poly'){mat='Листов поликарбоната (2,1×6 м): <strong>'+Math.ceil(clad*1.1/12.6)+' шт</strong>';}
else{mat='Плёнки шириной 3 м: <strong>'+Math.ceil(clad*1.1/3)+' пог. м</strong>';}
const vents=Math.max(2,Math.ceil(S*0.2/0.54));
const kw=(season==='winter'?(cover==='poly'?0.15:0.25):(cover==='poly'?0.05:0.08))*S;
document.getElementById('resG').innerHTML='<div class="rb fade-in"><h3>Ваша теплица '+L+'×'+W+' м</h3><ul><li>📐 Площадь: <strong>'+S.toFixed(1)+' м²</strong></li><li>📦 Объём: <strong>'+V+' м³</strong></li><li>🧱 Покрытие (с запасом 10%): <strong>'+clad+' м²</strong></li><li>🛒 '+mat+'</li><li>🌬 Форточек 60×90 см: <strong>'+vents+' шт</strong></li><li>🔥 Обогрев: <strong>'+kw.toFixed(1)+' кВт</strong></li></ul><div class="ti">💡 Форточки ставьте в крыше и торцах: тёплый воздух уходит вверх. Зимой мощность считайте с запасом +20% на сильные морозы.</div></div>';
document.getElementById('resG').scrollIntoView({behavior:'smooth'});
}
</script>
