<script>
function calcBed(){
const L=parseFloat(document.getElementById('rbL').value);
const W=parseFloat(document.getElementById('rbW').value);
const H=parseFloat(document.getElementById('rbH').value);
const dr=parseFloat(document.getElementById('rbDrain').value);
const dens=parseFloat(document.getElementById('rbSoil').value);
if(!L||!W||!H)return alert('Заполните размеры');
const gap=10;
const soilH=H-gap-dr;
if(soilH<=0){document.getElementById('resRB').innerHTML='<div class="rb fade-in"><h3>Слишком низкий борт</h3><p>При высоте '+H+' см и дренаже '+dr+' см для грунта не остаётся места. Увеличьте борт минимум до '+(dr+gap+5)+' см.</p></div>';return;}
const volTotal=Math.round(L*W*H/100*1000);
const volDrain=dr>0?Math.round(L*W*dr/100*1000):0;
const volSoil=Math.round(L*W*soilH/100*1000);
const m50=Math.ceil(volSoil/50);
const m70=Math.ceil(volSoil/70);
const kg=Math.round(volSoil*dens);
const kgT=kg>=1000?(kg/1000).toFixed(2)+' т':kg+' кг';
document.getElementById('resRB').innerHTML='<div class="rb fade-in"><h3>Короб '+L+'×'+W+'×'+H+' см</h3><ul><li>📦 Полный объём: <strong>'+volTotal+' л</strong></li>'+(dr>0?'<li>🪵 Дренаж (ветки/щёбень): <strong>'+volDrain+' л</strong></li>':'')+'<li>🌱 Грунта нужно: <strong>'+volSoil+' л</strong></li><li>🛒 Мешков 50 л: <strong>'+m50+' шт</strong> · 70 л: <strong>'+m70+' шт</strong></li><li>⚖️ Вес грунта: <strong>~'+kgT+'</strong></li></ul><div class="ti">💡 Укладывайте слоями снизу вверх: дренаж → трава/листья → грунт, смешанный с компостом (1:1). Не досыпайте до краёв — оставьте 10 см, чтобы вода не переливалась при поливе.</div></div>';
document.getElementById('resRB').scrollIntoView({behavior:'smooth'});
}
</script>
