<div><label for="muA">Площадь, м²</label><input type="number" id="muA" value="10" min="1" step="0.5"></div>
<div><label for="muT">Толщина слоя, см</label><input type="number" id="muT" value="5" min="2" step="1"></div>
</div>
<label for="muType">Тип мульчи</label>
<select id="muType">
<option value="350|0|Кора хвойная">Кора хвойная (закисляет)</option>

<option value="250|0|Опилки (перепревшие)">Опилки перепревшие</option>

<option value="1600|0|Гравий / камень">Гравий / камень (неорганика)</option>
</select>

<script>
function calcMulch(){
const A=parseFloat(document.getElementById('muA').value);
const T=parseFloat(document.getElementById('muT').value);
const parts=document.getElementById('muType').value.split('|');
const dens=parseFloat(parts[0]);
const shrink=parseFloat(parts[1]);
const name=parts[2];
if(!A||!T)return alert('Заполните площадь и толщину');
const vol=A*T/100;
const buyVol=shrink>0?vol/(1-shrink):vol;
const kg=Math.round(buyVol*dens);
const m50=Math.ceil(buyVol/0.05);
const m70=Math.ceil(buyVol/0.07);
const kgT=kg>=1000?(kg/1000).toFixed(2)+' т':kg+' кг';
let warn='';
if(name==='Солома')warn='<div class="wn">⚠️ Солома под клубникой и земляникой привлекает мышей — держите ловушки или замените на агроволокно.</div>';
if(name==='Кора хвойная')warn='<div class="wn">⚠️ Кора закисляет почву: не мульчируйте ею капусту, свёклу и картофель — они любят нейтральную землю. Зато идеальна под голубику, клюкву, рододендроны и клубнику.</div>';
if(name==='Скошенная трава'||name==='Опавшая листва')warn='<div class="wn">⚠️ Свежая трава и листва с семенами сорняков засорят грядку. Сушите слой 2–3 дня перед укладкой или берите только без семян.</div>';
if(name==='Опилки (перепревшие)')warn='<div class="wn">⚠️ Свежие опилки вытягивают азот. Используйте только перепревшие (отлежавшие год) или подсыпайте мочевину: 20 г на ведро.</div>';
document.getElementById('resMU').innerHTML='<div class="rb fade-in"><h3>Мульча: '+name+'</h3><ul><li>📐 Площадь: <strong>'+A+' м²</strong> · слой: <strong>'+T+' см</strong></li><li>📦 Объём на выходе: <strong>'+vol.toFixed(2)+' м³</strong>'+(shrink>0?' (после усадки)':'')+'</li><li>🛒 Покупать с запасом на усадку: <strong>'+buyVol.toFixed(2)+' м³</strong></li><li>🧺 Мешков 50 л: <strong>'+m50+' шт</strong> · 70 л: <strong>'+m70+' шт</strong></li><li>⚖️ Вес: <strong>~'+kgT+'</strong></li></ul>'+(warn||'<div class="ti">✅ Этот тип мульчи универсален и не имеет критичных ограничений по культурам.</div>')+'<div class="ti">💡 Мульчируйте по влажной земле после полива, отступая 3–5 см от стебля, чтобы он не подпревал. Обновляйте слой раз в сезон.</div></div>';
document.getElementById('resMU').scrollIntoView({behavior:'smooth'});
}
</script>
